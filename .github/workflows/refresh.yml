name: refresh-catalogs

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh data sources
        run: python3 scripts/refresh_all.py
      - name: Upload to Release v1.0
        run: |
          for f in data/horizons_*.json data/ndbc_*.json data/jpl_*.json data/swpc_*.json; do
            if [ -f "$f" ]; then
              gh release upload v1.0 "$f" --clobber
              echo "uploaded $f"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: TAP tables -> CDN
        run: |
          TABLES=(
            "vizier|J/A+A/570/A106/void"
            "vizier|J/A+A/594/A27/psz2"
            "vizier|J/ApJ/851/48/table1"
            "vizier|J/ApJ/852/22/sample"
            "vizier|J/ApJ/935/170/table4"
            "vizier|J/ApJ/938/110/table7"
            "vizier|J/ApJS/229/28/table1"
            "vizier|VII/278/snrs"
            # HEASARC needs VOTable parser (doesn't support CSV/JSON)
            # "heasarc|integralburst"
            # "heasarc|nicermastr"
            # "heasarc|batsegrb"
            # "heasarc|xmm4d13s"
            # "heasarc|chandracsc2"
            # "heasarc|fermilpsc"
            # "heasarc|fermi4lac"
            "irsa|neowiser_p1bs_psd"
            "irsa|allwise_p3as_psd"
          )
          mkdir -p data data/uploaded
          for entry in "${TABLES[@]}"; do
            IFS='|' read -r service table <<< "$entry"
            echo "  TAP: $service/$table"
            python3 scripts/tap_downloader.py "$service" "$table" && \
              for f in data/tap_*.json data/tap_*.csv; do
                [ -f "$f" ] && gh release upload v1.0 "$f" --clobber && mv "$f" "data/uploaded/"
              done
            sleep 2
          done
          # Remove uploaded data from git tracking (too large for git)
          rm -f data/tap_*.json data/tap_*.csv 2>/dev/null
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit data snapshot (audit trail)
        run: |
          git config user.name "omegaflow-bot"
          git config user.email "bot@omegaflow.space"
          # Exclude tap data files from git (too large, already on Release)
          echo 'data/tap_*.json' >> .gitignore
          echo 'data/tap_*.csv' >> .gitignore
          git add data/ .gitignore
          git diff --staged --quiet || git commit -m "refresh $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
